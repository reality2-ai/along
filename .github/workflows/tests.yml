name: Core checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: bash -n start-ai.sh
# Real-data and static browser checks run locally against a preserved dataset.
# Do not silently download a changing upstream snapshot in every pull request.
