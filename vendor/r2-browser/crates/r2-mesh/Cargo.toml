[package]
name = "r2-mesh"
description = "Compatibility facade over r2-transport (L1), r2-discovery (L2), r2-routing (L3)"
edition.workspace = true
# MERGE NOTE (step 2): the root workspace license is "MIT" (the old hive root's);
# this crate keeps the old CORE root's dual license explicitly, so the move
# changed no crate's licence.
license = "MIT OR Apache-2.0"
version.workspace = true

[package.metadata.reality2]
identity = "ai.reality2.mesh"
kind = "component"

[features]
# Additive only, and FORWARDED: a consumer enabling `r2-mesh/std` must still
# get every std::error::Error impl, which now live in the layer crates.
default = []
std = ["r2-transport/std", "r2-discovery/std", "r2-routing/std"]

[dependencies]
r2-transport = { workspace = true }
r2-discovery = { workspace = true }
r2-routing = { workspace = true }

# No [lints] block, deliberately: this crate carries code moved verbatim from
# r2-mesh (D-226), which never opted into the workspace lint set. Opting the
# moved code in would manufacture ~150 warnings against a frozen baseline of
# zero; tightening is its own change, after the split settles.
