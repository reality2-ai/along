[package]
name = "r2-routing"
description = "Reality2 Layer 3: routing — neighbour table, custody, replication budget (sans-IO)"
edition.workspace = true
# Carries code from the old CORE root (via r2-mesh, D-226 increment 2):
# keeps that root's dual licence so the move changed no crate's licence.
license = "MIT OR Apache-2.0"
version.workspace = true

[package.metadata.reality2]
identity = "ai.reality2.l3.routing"
kind = "component"

[features]
default = []
std = ["r2-transport/std", "r2-wire/std"]

[dependencies]
r2-discovery.workspace = true
r2-ident = { workspace = true }
r2-hal-traits = { workspace = true }
r2-transport = { workspace = true }
# The routing half of the named upward edge (SS380): BUDGET_FLOODING,
# obliged by the STANDARD (L3 5.5.5 <-> L4 4.1.2a). This crate parses no
# frame; it compares one budget constant.
r2-wire = { workspace = true }

# No [lints] block, deliberately: this crate carries code moved verbatim from
# r2-mesh (D-226), which never opted into the workspace lint set. Opting the
# moved code in would manufacture ~150 warnings against a frozen baseline of
# zero; tightening is its own change, after the split settles.
