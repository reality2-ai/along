[package]
name = "hive-wasm"
description = "Browser hive: wasm32 build of the Reality2 stack over browser facilities"
edition.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.reality2]
identity = "ai.reality2.hive.wasm"
kind = "component"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
r2-wire.workspace = true
hive-web-identity.workspace = true
r2-mesh.workspace = true
r2-hal-traits.workspace = true
r2-trust = { workspace = true, features = ["formats-suite"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
zeroize.workspace = true
